[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vectortile"
version = "0.1.0"
description = "Reproducible, bounded-workspace exact nearest-neighbor search"
readme = "README.md"
license = "MIT"
authors = [{name = "Wumou Xie"}]
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
torch = ["torch>=2.1"]
plots = ["matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/Simonn777/VectorTile"
Demo = "https://simonn777.github.io/VectorTile/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
